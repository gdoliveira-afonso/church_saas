services:
  postgres:
    image: postgres:16
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password}
      POSTGRES_DB: ${POSTGRES_DB:-church_crm}
    expose:
      - "5432"
    # ATENÇÃO (Segurança): porta 5432 NÃO deve ser exposta em produção.
    # Descomente abaixo APENAS para acesso local de debug:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-church_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crm_celular_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL:-postgresql://crm:crm_password@postgres:5432/church_crm?schema=public}
      - SAAS_DOMAIN=${SAAS_DOMAIN:-}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME:-superadmin}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - MATRIZ_NAME=${MATRIZ_NAME:-Igreja Matriz}
      - MATRIZ_CONGREGATION=${MATRIZ_CONGREGATION:-Igreja Sede}
      - MATRIZ_ADMIN_NAME=${MATRIZ_ADMIN_NAME:-Admin Matriz}
      - MATRIZ_ADMIN_USERNAME=${MATRIZ_ADMIN_USERNAME:-admin}
      - MATRIZ_ADMIN_PASSWORD=${MATRIZ_ADMIN_PASSWORD}
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_SERVICE_ACCOUNT_KEY=${FCM_SERVICE_ACCOUNT_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/public/org/saas-admin', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    volumes:
      - crm_uploads_data:/app/uploads
    expose:
      - "3000"
    # Descomente abaixo apenas para debug local:
    # ports:
    #   - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_celular_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
    volumes:
      # Volume com certificados SSL — copie fullchain.pem e privkey.pem para cá
      # e ative o bloco HTTPS no nginx.conf para habilitar HTTPS
      - crm_ssl_data:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  crm_pg_data:       # Dados do PostgreSQL (persistente entre reboots)
  crm_uploads_data:  # Logos e imagens enviadas pelas igrejas
  crm_ssl_data:      # Certificados SSL (fullchain.pem + privkey.pem)
