# ============================================================
# CRM Celular SaaS — Nginx Configuration
# Suporta wildcard de subdomínios (*.saas.com.br) e
# domínios customizados das igrejas (minha-igreja.com.br)
# ============================================================

# ============================================================
# BLOCO HTTP — Ativo em desenvolvimento
# Em produção com SSL: descomente o redirect abaixo e ative o bloco HTTPS
# ============================================================
server {
    listen 80;
    server_name _; # Aceita qualquer domínio/subdomínio

    # EM PRODUÇÃO COM SSL: descomente a linha abaixo e comente o restante deste bloco
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # SPA: qualquer rota não encontrada cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Assets estáticos com cache longo
    location ~* \.(css|js|jpg|jpeg|svg|png|gif|ico|eot|woff|woff2|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Proxy da API — repassa Host e X-Forwarded-Host para o backend resolver a org pelo domínio
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # Proxy de uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

