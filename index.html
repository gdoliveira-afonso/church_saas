<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestão Celular" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gestão Celular - SGI v1.1</title>
    <link rel="manifest" href="/api/public/settings/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
        rel="stylesheet" />
    <script>
        // Early initialization of branding (favicon, title, theme)
        (function () {
            // Theme
            const t = localStorage.getItem('theme');
            if (t === 'dark') document.documentElement.classList.add('dark');

            // Branding
            try {
                const s = JSON.parse(localStorage.getItem('system-settings'));
                if (s) {
                    if (s.appName) document.title = s.appName;
                    if (s.logoUrl) {
                        let l = document.createElement('link');
                        l.rel = 'icon';
                        l.href = localStorage.getItem('system-logo-b64') || s.logoUrl;
                        document.head.appendChild(l);
                    }
                    if (s.primaryColor) {
                        const hexToRgb = h => {
                            let r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
                            return r ? `${parseInt(r[1], 16)} ${parseInt(r[2], 16)} ${parseInt(r[3], 16)}` : null;
                        };
                        const rgb = hexToRgb(s.primaryColor);
                        if (rgb) document.documentElement.style.setProperty('--color-primary', rgb);
                    }
                }
            } catch (e) { }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: 'rgb(var(--color-primary) / <alpha-value>)', 'primary-light': '#e8effd', success: '#22c55e', warning: '#f59e0b', danger: '#ef4444' },
                    fontFamily: { display: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: 19 91 236;
        }
    </style>
    <style>
        /* ── Splash Screen & Preload ── */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            /* slate-100 */
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }

        .dark #splash-screen {
            background-color: #0f172a;
            /* slate-900 */
        }

        #splash-logo-wrap {
            animation: logo-pulse 1.6s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes logo-pulse {
            0%, 100% { transform: scale(1);    opacity: 1; }
            50%       { transform: scale(0.91); opacity: 0.72; }
        }

        #app-shell {
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        .app-ready #app-shell {
            opacity: 1;
        }

        .app-ready #splash-screen {
            opacity: 0;
            visibility: hidden;
        }

        /* ── Page Loader Bar (in-app navigation) ── */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: #135bec;
            z-index: 99998;
            transition: width 0.2s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        #page-loader.loading {
            opacity: 1;
            animation: page-loader-progress 0.8s ease-out forwards;
        }
        #page-loader.done {
            width: 100% !important;
            opacity: 0;
            transition: width 0.1s ease-out, opacity 0.4s ease-out 0.1s;
        }
        @keyframes page-loader-progress {
            0%   { width: 0%; }
            30%  { width: 40%; }
            60%  { width: 70%; }
            100% { width: 90%; }
        }

        * {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            background-color: #ffffff;
        }

        .dark html,
        .dark body {
            background-color: #0f172a;
        }

        #app-shell {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Safe area para status bar — só ativa quando JS detecta overlay real */
        .native-overlay #app-shell {
            padding-top: var(--safe-area-top, env(safe-area-inset-top, 28px));
        }

        .dark #app-shell {
            background-color: #0f172a;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Prevent auto-zoom on mobile inputs */
        @media screen and (max-width: 767px) {
            input,
            select,
            textarea {
                font-size: 16px !important;
            }
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 999px;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        #toast-container {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }

        .native-overlay #toast-container {
            top: calc(1rem + var(--safe-area-top, env(safe-area-inset-top, 28px)));
        }

        .toast {
            animation: toastIn .3s ease-out;
            pointer-events: auto;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive shell */
        @media (min-width: 768px) {
            #app-shell {
                display: flex;
                flex-direction: row;
            }

            #sidebar:not(.sidebar-hidden) {
                display: flex !important;
            }

        }

        @media (min-width: 1280px) {
            #sidebar {
                width: 280px;
            }
        }

        @media (max-width: 767px) {
            #sidebar {
                display: none !important;
            }
        }

        #sidebar.sidebar-hidden {
            display: none !important;
        }

        /* Smooth transitions for interactive elements */
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }

        /* ── Dark Mode Overrides ── */
        .dark body,
        .dark #app-shell {
            background: #0f172a;
        }

        .dark #sidebar {
            background: #1e293b;
            border-color: #334155;
        }

        .dark #sidebar .text-slate-900 {
            color: #f1f5f9;
        }

        .dark #sidebar .text-slate-400 {
            color: #94a3b8;
        }

        .dark #sidebar .border-slate-100,
        .dark #sidebar .border-slate-200 {
            border-color: #334155;
        }

        .dark #sidebar .bg-slate-50\/50 {
            background: rgba(30, 41, 59, 0.5);
        }

        .dark #app {
            background: #0f172a;
            color: #e2e8f0;
        }

        .dark header,
        .dark .sticky {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        .dark .bg-white {
            background: #1e293b !important;
        }

        .dark .bg-slate-50,
        .dark .bg-slate-100 {
            background: #0f172a !important;
        }

        .dark .border-slate-100,
        .dark .border-slate-200 {
            border-color: #334155 !important;
        }

        .dark .text-slate-900 {
            color: #f1f5f9 !important;
        }

        .dark .text-slate-700,
        .dark .text-slate-800 {
            color: #cbd5e1 !important;
        }

        .dark .text-slate-600 {
            color: #94a3b8 !important;
        }

        .dark .text-slate-500 {
            color: #64748b !important;
        }

        .dark .text-slate-400 {
            color: #64748b !important;
        }

        .dark input,
        .dark select,
        .dark textarea {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }

        .dark input::placeholder,
        .dark textarea::placeholder {
            color: #475569 !important;
        }

        .dark .hover\:bg-slate-50:hover,
        .dark .hover\:bg-slate-100:hover {
            background: #334155 !important;
        }

        .dark .bg-primary\/10 {
            background: rgba(19, 91, 236, 0.15) !important;
        }

        .dark .mobile-nav {
            background: #1e293b !important;
            border-color: #334155 !important;
        }

        .dark .mobile-nav .text-slate-400 {
            color: #64748b !important;
        }

        .dark #modal-overlay .bg-white,
        .dark #modal-content {
            background: #1e293b !important;
            color: #e2e8f0 !important;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        .dark .shadow-sm,
        .dark .shadow-lg,
        .dark .shadow-2xl {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4) !important;
        }

        .dark .bg-slate-50\/50 {
            background: rgba(15, 23, 42, 0.5) !important;
        }

        .dark .backdrop-blur-md {
            background: rgba(30, 41, 59, 0.95) !important;
        }
    </style>
</head>

<body
    class="bg-slate-100 dark:bg-slate-900 font-display text-slate-900 dark:text-slate-100 antialiased h-[100dvh] overflow-hidden transition-colors duration-300">

    <!-- Page Loader Bar -->
    <div id="page-loader"></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div id="splash-logo-wrap" style="width:88px;height:88px;border-radius:24px;background:rgba(19,91,236,0.1);display:flex;align-items:center;justify-content:center;margin-bottom:20px;">
            <img id="splash-logo-img" src="" alt="" style="display:none;width:68px;height:68px;border-radius:16px;object-fit:contain;">
            <span id="splash-logo-icon" class="material-symbols-outlined" style="font-size:52px;color:#135bec;">church</span>
        </div>
        <p id="splash-app-name" style="font-size:22px;font-weight:800;color:#0f172a;margin:0 0 4px 0;letter-spacing:-0.5px;">SGI</p>
        <p style="font-size:12px;color:#94a3b8;margin:0;">Sistema de Gestão de Igreja</p>
    </div>
    <script>
        // Preenche splash com dados cacheados (evita tela genérica)
        try {
            const ss = localStorage.getItem('system-settings');
            if (ss) {
                const s = JSON.parse(ss);
                if (s.churchName) document.getElementById('splash-app-name').textContent = s.churchName;
                if (s.logoUrl) {
                    const img = document.getElementById('splash-logo-img');
                    const icon = document.getElementById('splash-logo-icon');
                    img.src = localStorage.getItem('system-logo-b64') || s.logoUrl;
                    img.style.display = 'block';
                    icon.style.display = 'none';
                }
            }
        } catch(e) {}
        // Dark mode imediato para evitar flash branco
        if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark');
    </script>

    <div id="toast-container"></div>
    <div id="app-shell" class="flex h-[100dvh] w-full bg-slate-100 dark:bg-slate-900 transition-colors duration-300">
        <nav id="sidebar"
            class="hidden w-[260px] bg-white border-r border-slate-200 flex-col shrink-0 h-full overflow-y-auto z-30">
            <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-100">
                <div id="brand-logo-container"
                    class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-primary overflow-hidden">
                    <span id="brand-logo-icon" class="material-symbols-outlined text-xl">church</span>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-900 leading-tight">Gestão Celular</p>
                    <p class="text-[10px] text-slate-400 leading-tight">SGI v1.1</p>
                </div>
            </div>
            <div id="sidebar-links" class="flex-1 px-3 py-3 space-y-0.5 overflow-y-auto"></div>
            <div id="sidebar-user" class="px-4 py-3 border-t border-slate-100 bg-slate-50/50"></div>
        </nav>
        <main id="app" class="flex-1 flex flex-col h-full bg-white md:bg-slate-50 overflow-hidden relative">
        </main>
    </div>
    <div id="modal-overlay"
        class="hidden fixed inset-0 z-[60] bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-content"
            class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto mx-auto">
        </div>
    </div>
    <script type="module" src="/src/app.js"></script>
</body>

</html>
